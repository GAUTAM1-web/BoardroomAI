services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boardroom_ai
      POSTGRES_USER: boardroom
      POSTGRES_PASSWORD: boardroom_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardroom -d boardroom_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://boardroom:boardroom_dev_password@postgres:5432/boardroom_ai
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DEPLOYMENT_TARGET: ${DEPLOYMENT_TARGET:-docker}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-before-production}
      AUTH_EMAIL_ENABLED: ${AUTH_EMAIL_ENABLED:-true}
      AUTH_DEMO_ENABLED: ${AUTH_DEMO_ENABLED:-true}
      AUTH_GUEST_ENABLED: ${AUTH_GUEST_ENABLED:-true}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEMO_CONTENT_ENABLED: ${DEMO_CONTENT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      BUSINESS_DATA_MODE: ${BUSINESS_DATA_MODE:-demo}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-osm_nominatim}
      PLACES_PROVIDER: ${PLACES_PROVIDER:-osm_nominatim}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-gdelt_doc}
      CURRENCY_PROVIDER: ${CURRENCY_PROVIDER:-frankfurter}
      GOVERNMENT_DATA_PROVIDER: ${GOVERNMENT_DATA_PROVIDER:-world_bank}
      DEMOGRAPHICS_PROVIDER: ${DEMOGRAPHICS_PROVIDER:-world_bank}
      MAPS_API_KEY: ${MAPS_API_KEY:-}
      PLACES_API_KEY: ${PLACES_API_KEY:-}
      GDELT_API_KEY: ${GDELT_API_KEY:-}
      LIVE_DATA_CACHE_TTL_SECONDS: ${LIVE_DATA_CACHE_TTL_SECONDS:-900}
      LIVE_DATA_TIMEOUT_SECONDS: ${LIVE_DATA_TIMEOUT_SECONDS:-2.5}
      CURRENCY_BASE: ${CURRENCY_BASE:-USD}
      CURRENCY_QUOTES: ${CURRENCY_QUOTES:-EUR,GBP,INR}
      PROVIDER_USER_AGENT: ${PROVIDER_USER_AGENT:-BoardroomAI/1.0-local-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_BASE_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
      NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
