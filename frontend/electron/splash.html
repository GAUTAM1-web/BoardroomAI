<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boardroom AI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(56, 214, 198, 0.12), transparent 36%),
          linear-gradient(315deg, rgba(246, 200, 95, 0.1), transparent 32%),
          #07090d;
        color: #d7dee8;
      }

      main {
        width: 100%;
        padding: 34px;
        text-align: center;
      }

      img {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 22px 0 8px;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: 0;
        color: #ffffff;
      }

      p {
        margin: 0;
        color: #8b98a9;
        font-size: 14px;
      }

      .bar {
        position: relative;
        overflow: hidden;
        height: 3px;
        width: 220px;
        margin: 28px auto 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: #38d6c6;
        animation: load 1.2s ease-in-out infinite;
      }

      @keyframes load {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./build/icon.png" alt="" />
      <h1>Boardroom AI</h1>
      <p>Starting executive workspace</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
