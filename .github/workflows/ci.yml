name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boardroom_ai
          POSTGRES_USER: boardroom
          POSTGRES_PASSWORD: boardroom_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardroom -d boardroom_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://boardroom:boardroom_dev_password@localhost:5432/boardroom_ai
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      SESSION_SECRET: ci-session-secret-change-before-production
      JOB_QUEUE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check .
      - name: Tests
        working-directory: backend
        run: python -m pytest
      - name: Performance benchmark
        run: python scripts/performance_benchmark.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose config
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config
      - name: Build backend image
        run: docker build -f Dockerfile.backend .
      - name: Build frontend image
        run: docker build frontend

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e .
          pip-audit
